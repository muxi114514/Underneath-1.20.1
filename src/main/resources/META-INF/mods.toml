modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    #logoFile="logo.png"
    authors="${mod_authors}"
    credits="Underneath 原预设由 NLBlackEagle & Shivaxi（RLCraft Dregora）创作。"
    description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# P1 起（方块映射需要时）在此追加方块来源 mod 依赖：
#   epca / betternether / quark / biomesoplenty / defiledlands /
#   lycanitesmobs / dynamictrees / scalinghealth
# 缺失时按映射表回退占位，故此处暂不声明为强制依赖。
